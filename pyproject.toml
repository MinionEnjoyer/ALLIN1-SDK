[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allin1-sdk"
version = "0.5.9"
description = "Standalone GTA V add-on authoring, package auditing, and native asset inspection SDK"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "click>=8.0",
    "lxml>=4.9",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
allin1-sdk = "allin1_sdk.console_entry:main"
allin1-sdk-agent = "allin1_sdk.agent_host:main"

[project.gui-scripts]
allin1-sdk-gui = "allin1_sdk.app:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "jsonschema>=4.20"]
release = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

# Keep the source/wheel contract aligned with the packaged desktop build.  The
# catalogs are runtime inputs; the remaining files are authoring references and
# the auditable, fail-closed Story runtime source—not prebuilt game binaries.
[tool.setuptools.data-files]
"share/allin1-sdk/assets" = [
    "assets/axle-prefabs.json",
    "assets/visual-tyre-packages.json",
]
"share/allin1-sdk/docs" = ["docs/*.md"]
"share/allin1-sdk/docs/adr" = ["docs/adr/*.md"]
"share/allin1-sdk/examples/axle-prefabs" = ["examples/axle-prefabs/*"]
"share/allin1-sdk/examples/oiv-axle-bundles" = ["examples/oiv-axle-bundles/*"]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles" = [
    "runtime/VehicleWorkbenchAxles/*.md",
    "runtime/VehicleWorkbenchAxles/CMakeLists.txt",
    "runtime/VehicleWorkbenchAxles/CMakePresets.json",
]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles/examples" = [
    "runtime/VehicleWorkbenchAxles/examples/*",
]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles/include/vehicle_workbench_axles" = [
    "runtime/VehicleWorkbenchAxles/include/vehicle_workbench_axles/*.hpp",
]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles/profiles" = [
    "runtime/VehicleWorkbenchAxles/profiles/*",
]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles/schemas" = [
    "runtime/VehicleWorkbenchAxles/schemas/*",
]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles/src" = [
    "runtime/VehicleWorkbenchAxles/src/*",
]
"share/allin1-sdk/runtime/VehicleWorkbenchAxles/tests" = [
    "runtime/VehicleWorkbenchAxles/tests/*",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["allin1_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
omit = [
    "src/allin1_sdk/app.py",
    "src/allin1_sdk/addon_sdk_ui.py",
    "src/allin1_sdk/asset_viewer.py",
    "src/allin1_sdk/vehicle_workbench.py",
    "src/allin1_sdk/weapon_workbench.py",
    "src/allin1_sdk/ped_workbench.py",
    "src/allin1_sdk/model_material_workbench.py",
    "src/allin1_sdk/workbench.py",
    "src/allin1_sdk/binary_workspace_ui.py",
    "src/allin1_sdk/oiv_workbench_ui.py",
    "src/allin1_sdk/rpf_explorer.py",
    "src/allin1_sdk/rpf_graph_ui.py",
    "src/allin1_sdk/rpf_change_set_ui.py",
    "src/allin1_sdk/rpf_program_ui.py",
    "src/allin1_sdk/sdk_console.py",
    "src/allin1_sdk/help_center.py",
    "src/allin1_sdk/detector.py",
    "src/allin1_sdk/mods.py",
]
