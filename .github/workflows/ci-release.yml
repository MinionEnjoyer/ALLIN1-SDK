name: SDK CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install and test SDK
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyinstaller
          python -m pytest --cov=allin1_sdk --cov-report=term-missing

      - name: Build self-contained Windows SDK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          dotnet publish tools/RpfPatcher/RpfPatcher.csproj -c Release --nologo --self-contained true -r win-x64 -o build/rpf
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ALLIN1-SDK --icon "${{ github.workspace }}/assets/favicon.ico" --add-data "${{ github.workspace }}/assets;assets" --distpath build/app --workpath build/pyinstaller --specpath build src/allin1_sdk/app.py
          python scripts/package_release.py --app-dir build/app/ALLIN1-SDK --rpf-dir build/rpf --output build/releases --version "${{ github.ref_name }}"

      - name: Publish tagged SDK release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "ALLIN1 SDK ${{ github.ref_name }}" --generate-notes build/releases/*
