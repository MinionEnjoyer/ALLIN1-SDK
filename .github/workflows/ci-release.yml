name: SDK CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install and test SDK
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyinstaller
          python -m pytest --cov=allin1_sdk --cov-report=term-missing

  native-asi:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and validate edition-specific native ASIs
        shell: pwsh
        run: |
          ./scripts/build_native_asi.ps1 -OutputDirectory build/native -BuildId "$env:GITHUB_SHA" -Unsigned

      - name: Package checksum-verifiable native candidates
        shell: pwsh
        run: |
          $cmake = Get-Content runtime/VehicleWorkbenchAxles/CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(VehicleWorkbenchAxles\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not derive the native axle runtime version.'
          }
          $runtimeVersion = $Matches[1]
          New-Item -ItemType Directory -Force build/native/releases | Out-Null
          foreach ($edition in @('Legacy','Enhanced')) {
            "This is an unsigned test candidate from commit $env:GITHUB_SHA. Its validation receipt does not mark a GTA build supported." |
              Set-Content "build/native/stage/$edition/UNSIGNED_BUILD.txt" -Encoding utf8
            $archive = "build/native/releases/VehicleWorkbenchAxles-$edition-$runtimeVersion-unsigned-win-x64.zip"
            Compress-Archive -Path "build/native/stage/$edition/*" -DestinationPath $archive
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            "$digest  $([IO.Path]::GetFileName($archive))" | Set-Content "$archive.sha256" -Encoding ascii
          }

      - name: Upload Legacy native ASI candidate
        uses: actions/upload-artifact@v4
        with:
          name: VehicleWorkbenchAxles-Legacy-${{ github.sha }}-unsigned
          path: build/native/releases/VehicleWorkbenchAxles-Legacy-*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Enhanced native ASI candidate
        uses: actions/upload-artifact@v4
        with:
          name: VehicleWorkbenchAxles-Enhanced-${{ github.sha }}-unsigned
          path: build/native/releases/VehicleWorkbenchAxles-Enhanced-*
          if-no-files-found: error
          retention-days: 14

  manual-build:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
          $version = python -c "from allin1_sdk import __version__; print(__version__)"
          "SDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build self-contained Windows SDK
        shell: pwsh
        run: |
          dotnet publish tools/RpfPatcher/RpfPatcher.csproj -c Release --nologo --self-contained true -r win-x64 -o build/rpf
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ALLIN1-SDK-Desktop --icon "${{ github.workspace }}/assets/favicon.ico" --add-data "${{ github.workspace }}/assets;assets" --distpath build/app --workpath build/pyinstaller --specpath build src/allin1_sdk/app.py
          python -m PyInstaller --noconfirm --clean --console --onefile --name allin1-sdk --icon "${{ github.workspace }}/assets/favicon.ico" --distpath build/app/ALLIN1-SDK-Desktop --workpath build/pyinstaller-cli --specpath build src/allin1_sdk/console_entry.py
          python -m PyInstaller --noconfirm --clean --console --onefile --name ALLIN1-SDK-Agent --icon "${{ github.workspace }}/assets/favicon.ico" --distpath build/app/ALLIN1-SDK-Desktop --workpath build/pyinstaller-agent --specpath build src/allin1_sdk/agent_host.py
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name ALLIN1-SDK-Updater --icon "${{ github.workspace }}/assets/favicon.ico" --distpath build/app/ALLIN1-SDK-Desktop --workpath build/pyinstaller-updater --specpath build src/allin1_sdk/updater_host.py

      - name: Smoke test frozen console entry point
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'allin1-sdk-smoke'
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'ALLIN1\Assistant') | Out-Null
          '{"schema":1,"mode":"disabled","workflow":"installer","profile":"disabled","endpoint":"","model_name":"","api_key_env":"","runtime_path":"","model_path":"","context_tokens":8192,"temperature":0.1}' | Set-Content (Join-Path $env:LOCALAPPDATA 'ALLIN1\Assistant\config.json') -Encoding utf8
          & build/app/ALLIN1-SDK-Desktop/allin1-sdk.exe assistant status | Out-File -FilePath build/frozen-cli-status.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Frozen allin1-sdk console smoke test failed.' }
          Get-Content build/frozen-cli-status.json | ConvertFrom-Json | Out-Null
          New-Item -ItemType Directory -Force build/app/ALLIN1-SDK-Desktop/assets | Out-Null
          Copy-Item -Path assets/* -Destination build/app/ALLIN1-SDK-Desktop/assets -Recurse -Force
          & build/app/ALLIN1-SDK-Desktop/allin1-sdk.exe list-axle-prefabs --axle-count 3 | Out-File -FilePath build/frozen-axle-catalog.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Frozen axle-catalog smoke test failed.' }
          $axleCatalog = Get-Content build/frozen-axle-catalog.json -Raw | ConvertFrom-Json
          $prefabIds = @($axleCatalog.prefabs | ForEach-Object { $_.id })
          if ($prefabIds -notcontains '6x2_rear_steer_bus') {
            throw 'Frozen axle catalog is missing required prefab 6x2_rear_steer_bus.'
          }
          if (@($axleCatalog.visual_tyre_packages).Count -eq 0) {
            throw 'Frozen axle catalog contains no visual tyre packages.'
          }

      - name: Package checksum-verifiable unsigned build
        shell: pwsh
        run: |
          python scripts/package_release.py --app-dir build/app/ALLIN1-SDK-Desktop --rpf-dir build/rpf --output build/releases --version "$env:SDK_VERSION" --build-id "$env:GITHUB_SHA"
          "This GitHub Actions artifact is an unsigned test build from commit $env:GITHUB_SHA. It is not an official signed release." |
            Set-Content build/releases/UNSIGNED_BUILD.txt -Encoding utf8

      - name: Upload unsigned SDK build
        uses: actions/upload-artifact@v4
        with:
          name: ALLIN1-SDK-${{ env.SDK_VERSION }}-unsigned-win-x64
          path: build/releases/*
          if-no-files-found: error
          retention-days: 14

  release:
    # Signed publishing is opt-in until the Azure trust relationship exists.
    # Unsigned, checksum-verifiable builds remain available through manual-build.
    if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_SIGNING_ENABLED == 'true'
    needs: [windows, native-asi]
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install release build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build self-contained Windows SDK
        shell: pwsh
        run: |
          dotnet publish tools/RpfPatcher/RpfPatcher.csproj -c Release --nologo --self-contained true -r win-x64 -o build/rpf
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ALLIN1-SDK-Desktop --icon "${{ github.workspace }}/assets/favicon.ico" --add-data "${{ github.workspace }}/assets;assets" --distpath build/app --workpath build/pyinstaller --specpath build src/allin1_sdk/app.py
          python -m PyInstaller --noconfirm --clean --console --onefile --name allin1-sdk --icon "${{ github.workspace }}/assets/favicon.ico" --distpath build/app/ALLIN1-SDK-Desktop --workpath build/pyinstaller-cli --specpath build src/allin1_sdk/console_entry.py
          python -m PyInstaller --noconfirm --clean --console --onefile --name ALLIN1-SDK-Agent --icon "${{ github.workspace }}/assets/favicon.ico" --distpath build/app/ALLIN1-SDK-Desktop --workpath build/pyinstaller-agent --specpath build src/allin1_sdk/agent_host.py
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name ALLIN1-SDK-Updater --icon "${{ github.workspace }}/assets/favicon.ico" --distpath build/app/ALLIN1-SDK-Desktop --workpath build/pyinstaller-updater --specpath build src/allin1_sdk/updater_host.py

      - name: Build and validate edition-specific native ASIs
        shell: pwsh
        run: |
          ./scripts/build_native_asi.ps1 -OutputDirectory build/native -BuildId "$env:GITHUB_SHA"

      - name: Smoke test frozen console entry point
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'allin1-sdk-smoke'
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'ALLIN1\Assistant') | Out-Null
          '{"schema":1,"mode":"disabled","workflow":"installer","profile":"disabled","endpoint":"","model_name":"","api_key_env":"","runtime_path":"","model_path":"","context_tokens":8192,"temperature":0.1}' | Set-Content (Join-Path $env:LOCALAPPDATA 'ALLIN1\Assistant\config.json') -Encoding utf8
          & build/app/ALLIN1-SDK-Desktop/allin1-sdk.exe assistant status | Out-File -FilePath build/frozen-cli-status.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Frozen allin1-sdk console smoke test failed.' }
          Get-Content build/frozen-cli-status.json | ConvertFrom-Json | Out-Null
          New-Item -ItemType Directory -Force build/app/ALLIN1-SDK-Desktop/assets | Out-Null
          Copy-Item -Path assets/* -Destination build/app/ALLIN1-SDK-Desktop/assets -Recurse -Force
          & build/app/ALLIN1-SDK-Desktop/allin1-sdk.exe list-axle-prefabs --axle-count 3 | Out-File -FilePath build/frozen-axle-catalog.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Frozen axle-catalog smoke test failed.' }
          $axleCatalog = Get-Content build/frozen-axle-catalog.json -Raw | ConvertFrom-Json
          $prefabIds = @($axleCatalog.prefabs | ForEach-Object { $_.id })
          if ($prefabIds -notcontains '6x2_rear_steer_bus') {
            throw 'Frozen axle catalog is missing required prefab 6x2_rear_steer_bus.'
          }
          if (@($axleCatalog.visual_tyre_packages).Count -eq 0) {
            throw 'Frozen axle catalog contains no visual tyre packages.'
          }

      - name: Build unsigned PE signing catalog
        shell: pwsh
        run: |
          $workspaceRoot = (Resolve-Path .).Path
          $targets = Get-ChildItem build/app/ALLIN1-SDK-Desktop,build/rpf,build/native/stage -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.pyd', '.asi' } |
            Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' } |
            ForEach-Object { [IO.Path]::GetRelativePath($workspaceRoot, $_.FullName) }
          if (-not $targets) {
            throw 'No unsigned Windows executable payloads were found to sign.'
          }
          $targets | Set-Content build/signing-catalog.txt -Encoding utf8

      - name: Sign in to Azure for release signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows SDK payloads
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\build\signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ALLIN1 SDK
          description-url: https://github.com/MinionEnjoyer/ALLIN1-SDK

      - name: Verify release signatures and package SDK
        shell: pwsh
        run: |
          $failures = Get-ChildItem build/app/ALLIN1-SDK-Desktop,build/rpf,build/native/stage -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.pyd', '.asi' } |
            Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' } |
            Select-Object -ExpandProperty FullName
          if ($failures) {
            $failures | ForEach-Object { Write-Error "Unsigned or invalid executable payload: $_" }
            throw 'Release packaging refused because executable payload signatures are incomplete.'
          }
          foreach ($edition in @('Legacy','Enhanced')) {
            $asi = "build/native/stage/$edition/VehicleWorkbenchAxles.asi"
            $settingsEditor = "build/native/stage/$edition/VehicleWorkbenchAxles.Settings.exe"
            $receiptPath = "build/native/stage/$edition/build-validation-receipt.json"
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            $receipt.sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $asi).Hash.ToLowerInvariant()
            $receipt.authenticode_certificate_present = $true
            $receipt.settings_editor.sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $settingsEditor).Hash.ToLowerInvariant()
            $receipt.settings_editor.authenticode_certificate_present = $true
            $receipt.unsigned = $false
            $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $receiptPath -Encoding utf8
            $metadataPath = "build/native/stage/$edition/VehicleWorkbenchAxles/runtime-metadata.json"
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            $metadata.binary_sha256 = $receipt.sha256
            $metadata.settings_editor_sha256 = $receipt.settings_editor.sha256
            $metadata.settings_editor_authenticode_certificate_present = $true
            $metadata | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $metadataPath -Encoding utf8
          }
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
          $cmake = Get-Content runtime/VehicleWorkbenchAxles/CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(VehicleWorkbenchAxles\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not derive the native axle runtime version.'
          }
          $runtimeVersion = $Matches[1]
          python scripts/package_release.py --app-dir build/app/ALLIN1-SDK-Desktop --rpf-dir build/rpf --output build/releases --version "$releaseVersion" --build-id "$env:GITHUB_SHA"
          foreach ($edition in @('Legacy','Enhanced')) {
            $archive = "build/releases/VehicleWorkbenchAxles-$edition-$runtimeVersion-win-x64.zip"
            Compress-Archive -Path "build/native/stage/$edition/*" -DestinationPath $archive
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            "$digest  $([IO.Path]::GetFileName($archive))" | Set-Content "$archive.sha256" -Encoding ascii
          }

      - name: Publish tagged SDK release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "ALLIN1 SDK ${{ github.ref_name }}" --generate-notes build/releases/*
